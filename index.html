<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIS Tunas Unggul</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e3e6ec; --accent:#1f5eff; --ok:#12805c; --bad:#b42318; --chip:#eef2ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --ink:#e8ebf2; --muted:#9aa4b5; --line:#2a3140; --accent:#6d9bff; --ok:#4cc79a; --bad:#ff8a80; --chip:#232b3d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:880px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  h1 { font-size:1.4rem; margin:0; }
  h2 { font-size:1.05rem; margin:0 0 8px; }
  .sub { color:var(--muted); margin:2px 0 0; font-size:.95rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; padding:8px 14px; }
  button.ghost { background:transparent; color:var(--accent); }
  input, select { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); min-width:0; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .bar input { flex:1 1 200px; }
  .tag { display:inline-block; padding:1px 10px; border-radius:99px; border:1px solid var(--line); background:var(--chip); margin:0 6px 4px 0; font-size:.88rem; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .muted { color:var(--muted); }
  .hidden { display:none; }
  details.cls { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; }
  details.cls > summary { cursor:pointer; padding:14px 18px; list-style:none; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  details.cls > summary::-webkit-details-marker { display:none; }
  .cname { font-weight:600; }
  .cnt { color:var(--muted); font-size:.92rem; white-space:nowrap; }
  .body { padding:0 18px 16px; border-top:1px solid var(--line); }
  .body h3 { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  td, th { text-align:left; padding:5px 8px 5px 0; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  @media (max-width:520px) { td:nth-child(2), th:nth-child(2) { display:none; } }
  details.raw { margin-top:20px; color:var(--muted); }
  pre { overflow:auto; font-size:.8rem; }
</style>
</head>
<body>
<main>
  <section id="loginBox" class="card hidden">
    <h1>SIS Tunas Unggul</h1>
    <p class="sub">Masuk dengan akun Google sekolah.</p>
    <p><button id="btnLogin">Masuk dengan Google</button></p>
    <p id="loginMsg" class="bad"></p>
  </section>

  <section id="app" class="hidden">
    <header>
      <div>
        <h1>SIS Tunas Unggul</h1>
        <p class="sub" id="who"></p>
      </div>
      <button id="btnLogout" class="ghost">Keluar</button>
    </header>

    <p id="status" class="bad"></p>

    <section id="classesBox" class="hidden">
      <h2 id="classesTitle">Kelas</h2>
      <div class="bar">
        <select id="fLevel"></select>
        <input id="fSearch" type="search" placeholder="Cari nama atau NIS siswa">
      </div>
      <div id="classList"></div>
      <p id="classEmpty" class="muted hidden">Tidak ada kelas yang cocok.</p>
    </section>

    <details class="raw"><summary>Data mentah akun (untuk pemeriksaan)</summary><pre id="raw"></pre></details>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://iglhqkfpiofhjoepxcwt.supabase.co";
const SUPABASE_KEY = "sb_publishable_vFO8LaTt2SxiIX6ZfadqzQ_pXHEPxK0";   // kunci publik, aman di halaman web
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

// Pembantu membuat elemen. Teks selalu lewat textContent, jadi aman dari injeksi HTML.
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) { if (k === "class") e.className = props[k]; else e.setAttribute(k, props[k]); }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}

let ALL = [];   // kelas lengkap beserta siswa dan gurunya (hasil dari database)

async function show() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $("loginBox").classList.remove("hidden"); $("app").classList.add("hidden"); return; }
  $("loginBox").classList.add("hidden"); $("app").classList.remove("hidden");

  const { data: me, error } = await db.rpc("claim_account");
  if (error) { $("status").textContent = "Terjadi kesalahan: " + error.message; return; }
  $("raw").textContent = JSON.stringify(me, null, 2);

  if (me.error === "email_not_verified") { $("status").textContent = "Email Google belum terverifikasi."; return; }
  const roles = [];
  if (me.is_admin) roles.push("Admin");
  if (me.is_principal) roles.push("Kepala sekolah");
  if ((me.coordinator_of || []).length) roles.push("Koordinator");
  if (me.staff) roles.push("Guru");
  if (me.student) roles.push("Siswa");
  if (me.guardian) roles.push("Orang tua");
  if (!roles.length) { $("status").textContent = "Berhasil masuk, tetapi email ini belum terdaftar di sekolah. Hubungi tim IT."; return; }
  $("status").textContent = "";
  const name = (me.staff && me.staff.name) || (me.student && me.student.name) || (me.guardian && me.guardian.name) || me.email;
  $("who").textContent = name + " · " + roles.join(", ");

  if (me.staff) await loadClasses(me); else $("classesBox").classList.add("hidden");
}

async function loadClasses(me) {
  const box = $("classesBox"); box.classList.remove("hidden");
  const { data: yr, error: e0 } = await db.from("academic_years").select("id,name").eq("is_current", true).maybeSingle();
  if (e0 || !yr) { $("classesTitle").textContent = "Belum ada tahun ajaran berjalan."; return; }
  $("classesTitle").textContent = "Kelas, tahun ajaran " + yr.name;

  const [cl, en, cs, dir] = await Promise.all([
    db.from("classes").select("id,name,code,level_code,levels(name,sort_order)").eq("academic_year_id", yr.id),
    db.from("enrollments").select("class_id,students(id,nis,full_name,nickname)").eq("academic_year_id", yr.id).is("end_date", null),
    db.from("class_staff").select("class_id,staff_id,role"),
    db.rpc("staff_directory")
  ]);
  const err = cl.error || en.error || cs.error || dir.error;
  if (err) { $("classesTitle").textContent = "Gagal memuat kelas: " + err.message; return; }

  const names = new Map((dir.data || []).map(s => [s.id, s.full_name]));
  const byClass = new Map();
  for (const c of cl.data) byClass.set(c.id, { ...c, students: [], staff: [] });
  for (const r of en.data) if (byClass.has(r.class_id) && r.students) byClass.get(r.class_id).students.push(r.students);
  for (const r of cs.data) if (byClass.has(r.class_id)) byClass.get(r.class_id).staff.push({ name: names.get(r.staff_id) || "(tanpa nama)", role: r.role });

  ALL = [...byClass.values()].sort((a, b) =>
    (a.levels?.sort_order ?? 99) - (b.levels?.sort_order ?? 99) || a.name.localeCompare(b.name, "id", { numeric: true }));
  for (const c of ALL) c.students.sort((a, b) => a.full_name.localeCompare(b.full_name, "id"));

  const sel = $("fLevel"); sel.replaceChildren(el("option", { value: "" }, "Semua tingkat"));
  const seen = new Set();
  for (const c of ALL) if (!seen.has(c.level_code)) { seen.add(c.level_code); sel.append(el("option", { value: c.level_code }, c.levels?.name || c.level_code)); }
  render();
}

function render() {
  const lv = $("fLevel").value, q = $("fSearch").value.trim().toLowerCase();
  const list = $("classList"); list.replaceChildren();
  let shown = 0;
  for (const c of ALL) {
    if (lv && c.level_code !== lv) continue;
    const hits = q ? c.students.filter(s => s.full_name.toLowerCase().includes(q) || (s.nickname || "").toLowerCase().includes(q) || s.nis.toLowerCase().includes(q)) : c.students;
    if (q && !hits.length) continue;
    shown++;

    const homeroom = c.staff.filter(s => s.role === "homeroom").map(s => s.name);
    const others = c.staff.filter(s => s.role !== "homeroom").map(s => s.name);
    const d = el("details", { class: "cls" });
    if (q) d.open = true;
    d.append(el("summary", null,
      el("span", { class: "cname" }, c.name),
      el("span", { class: "cnt" }, c.students.length + " siswa")));

    const body = el("div", { class: "body" });
    body.append(el("h3", null, "Guru"));
    if (!c.staff.length) body.append(el("span", { class: "muted" }, "Belum ada guru ditempatkan."));
    homeroom.forEach(n => body.append(el("span", { class: "tag" }, n + " (wali kelas)")));
    others.forEach(n => body.append(el("span", { class: "tag" }, n)));

    body.append(el("h3", null, "Siswa"));
    if (!hits.length) body.append(el("span", { class: "muted" }, "Belum ada siswa."));
    else {
      const t = el("table", null, el("tr", null, el("th", null, "Nama"), el("th", null, "Panggilan"), el("th", null, "NIS")));
      hits.forEach(s => t.append(el("tr", null, el("td", null, s.full_name), el("td", null, s.nickname || ""), el("td", null, s.nis))));
      body.append(t);
    }
    d.append(body); list.append(d);
  }
  $("classEmpty").classList.toggle("hidden", shown > 0);
}

$("fLevel").onchange = render;
$("fSearch").oninput = render;
$("btnLogin").onclick = async () => {
  const { error } = await db.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: "select_account" } }
  });
  if (error) $("loginMsg").textContent = error.message;
};
$("btnLogout").onclick = async () => { await db.auth.signOut(); show(); };
db.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") show(); });
show();
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIS Tunas Unggul</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e3e6ec; --accent:#1f5eff; --ok:#12805c; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --ink:#e8ebf2; --muted:#9aa4b5; --line:#2a3140; --accent:#6d9bff; --ok:#4cc79a; --bad:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; padding:10px 16px; }
  button.ghost { background:transparent; color:var(--accent); }
  dl { margin:0; display:grid; grid-template-columns:130px 1fr; gap:8px 12px; }
  dt { color:var(--muted); }
  dd { margin:0; }
  .tag { display:inline-block; padding:1px 10px; border-radius:99px; border:1px solid var(--line); margin:0 6px 4px 0; font-size:.9rem; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .hidden { display:none; }
  details { margin-top:12px; color:var(--muted); }
  pre { overflow:auto; font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1>SIS Tunas Unggul</h1>
  <p class="sub">Tahap uji coba: pemeriksaan login</p>

  <section id="loginBox" class="card hidden">
    <p>Masuk dengan akun Google sekolah.</p>
    <button id="btnLogin">Masuk dengan Google</button>
    <p id="loginMsg" class="bad"></p>
  </section>

  <section id="meBox" class="card hidden">
    <p id="status"></p>
    <dl id="info"></dl>
    <details><summary>Data mentah (untuk pemeriksaan)</summary><pre id="raw"></pre></details>
    <p><button id="btnLogout" class="ghost">Keluar</button></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://iglhqkfpiofhjoepxcwt.supabase.co";
const SUPABASE_KEY = "sb_publishable_vFO8LaTt2SxiIX6ZfadqzQ_pXHEPxK0";   // kunci publik, aman di halaman web
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

function row(dl, label, value) {
  const dt = document.createElement("dt"); dt.textContent = label;
  const dd = document.createElement("dd");
  if (Array.isArray(value)) value.forEach(v => { const s = document.createElement("span"); s.className = "tag"; s.textContent = v; dd.appendChild(s); });
  else dd.textContent = value;
  dl.append(dt, dd);
}

async function show() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $("loginBox").classList.remove("hidden"); $("meBox").classList.add("hidden"); return; }
  $("loginBox").classList.add("hidden"); $("meBox").classList.remove("hidden");

  const { data, error } = await db.rpc("claim_account");
  if (error) { $("status").textContent = "Terjadi kesalahan: " + error.message; $("status").className = "bad"; return; }
  $("raw").textContent = JSON.stringify(data, null, 2);

  const dl = $("info"); dl.replaceChildren();
  row(dl, "Email", data.email || session.user.email);
  const roles = [];
  if (data.is_admin) roles.push("Admin");
  if (data.is_principal) roles.push("Kepala sekolah");
  if ((data.coordinator_of || []).length) roles.push("Koordinator");
  if (data.staff) roles.push("Guru");
  if (data.student) roles.push("Siswa");
  if (data.guardian) roles.push("Orang tua");

  if (data.error === "email_not_verified") {
    $("status").textContent = "Email Google belum terverifikasi."; $("status").className = "bad"; return;
  }
  if (!roles.length) {
    $("status").textContent = "Berhasil masuk, tetapi email ini belum terdaftar di sekolah. Hubungi tim IT.";
    $("status").className = "bad";
    return;
  }
  $("status").textContent = "Berhasil masuk."; $("status").className = "ok";
  row(dl, "Peran", roles);
  if (data.staff) row(dl, "Nama", data.staff.name);
  if (data.student) row(dl, "Nama siswa", data.student.name);
  if ((data.classes || []).length) row(dl, "Kelas", data.classes.map(c => c.name + (c.role === "homeroom" ? " (wali kelas)" : "")));
}

$("btnLogin").onclick = async () => {
  const { error } = await db.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: "select_account" } }
  });
  if (error) $("loginMsg").textContent = error.message;
};
$("btnLogout").onclick = async () => { await db.auth.signOut(); show(); };
db.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") show(); });
show();
</script>
</body>
</html>
